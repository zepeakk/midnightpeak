    function App() {

      const [isRecordsOpen, setIsRecordsOpen] = React.useState(true);
      const [isPhotosOpen, setIsPhotosOpen] = React.useState(false);

      const [selectedDiscount, setSelectedDiscount] = React.useState(DISCOUNT_TYPES[0]);
      const [customAmount, setCustomAmount] = React.useState('');
      const [selectedType, setSelectedType] = React.useState('-');
      
      const [savedRecords, setSavedRecords] = React.useState(() => {
        const saved = localStorage.getItem('midnightRecords');
        return saved ? JSON.parse(saved) : [];
      });

      React.useEffect(() => {
        localStorage.setItem('midnightRecords', JSON.stringify(savedRecords));

      const ticketPrice = selectedDiscount.isCustom ? (Number(customAmount) || 0) : selectedDiscount.amount;
      const finalPrice = ticketPrice + FEE;

        const discountData = selectedDiscount.isCustom ? { name: `직접 입력 (${ticketPrice.toLocaleString()}원)`, amount: ticketPrice } : selectedDiscount;

      const handleDeleteRecord = (id) => setSavedRecords(savedRecords.filter(r => r.id !== id));

        const dateTimeA = `${a.schedule.date} ${a.schedule.time}`;

        return dateTimeA.localeCompare(dateTimeB);

        return viewedScheduleIds.size;

      const getActorTotalScheduleCount = (actorName) => PARK_SEULGI_SCHEDULES.filter(s => s.visitor === actorName || s.man === actorName || s.woman === actorName || s.p1 === actorName || s.p2 === actorName || s.p3 === actorName || s.p4 === actorName || s.pianist === actorName).length;

                                'bg-purple-500/20 text-purple-300 border border-purple-500/40'

                            >

                    </div>
                  );

              <div className="pt-2 border-t border-slate-800 flex justify-between items-center"><div><span className="text-slate-300 font-bold block">최종 결제액</span><span className="text-[9px] text-slate-500">(수수료 2,000원 포함)</span></div><span className="text-base font-extrabold text-amber-400">{finalPrice.toLocaleString()}원</span></div>
              <button onClick={handleSaveRecord} disabled={!selectedSchedule || !selectedSeat} className={`w-full mt-2 font-bold py-2 rounded-lg text-xs shadow-md transition ${selectedSchedule && selectedSeat ? 'bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white cursor-pointer active:scale-98' : 'bg-slate-800 text-slate-500 cursor-not-allowed'}`}>정산 저장</button>
            </div>

              <div className="flex items-center gap-1 text-[10px] text-slate-400"><span>{isRecordsOpen ? '접기' : '펼치기'}</span>{isRecordsOpen ? <ChevronUp className="w-3.5 h-3.5" /> : <ChevronDown className="w-3.5 h-3.5" />}</div>
            </button>
            {isRecordsOpen && (
              <div className="p-2.5 border-t border-slate-800 space-y-2 bg-slate-950/50">
                {savedRecords.length === 0 ? <p className="text-[10px] text-slate-500 text-center py-3">저장된 내역이 없습니다.</p> : (

                            <div className="flex items-center gap-1 overflow-hidden whitespace-nowrap text-[9.5px]">

            </div>
            
            <div className="w-36 mx-auto"><ActorCard actor={CAST_DATA.visitor} isMain={true} compact={true} userCount={getActorUserCount(CAST_DATA.visitor.name)} totalScheduleCount={getActorTotalScheduleCount(CAST_DATA.visitor.name)} /></div>
            
            <div className="space-y-0.5"><h3 className="text-[7.5px] font-bold text-slate-400 uppercase tracking-wider border-b border-slate-800 pb-0.5">MAN</h3><div className="grid grid-cols-3 gap-1">{CAST_DATA.man.map((actor) => <ActorCard key={actor.name} actor={actor} compact={true} userCount={getActorUserCount(actor.name)} totalScheduleCount={getActorTotalScheduleCount(actor.name)} />)}</div></div>
            
            <div className="space-y-0.5"><h3 className="text-[7.5px] font-bold text-slate-400 uppercase tracking-wider border-b border-slate-800 pb-0.5">WOMAN</h3><div className="grid grid-cols-3 gap-1">{CAST_DATA.woman.map((actor) => <ActorCard key={actor.name} actor={actor} compact={true} userCount={getActorUserCount(actor.name)} totalScheduleCount={getActorTotalScheduleCount(actor.name)} />)}</div></div>
            
            <div className="space-y-0.5"><h3 className="text-[7.5px] font-bold text-slate-400 uppercase tracking-wider border-b border-slate-800 pb-0.5">PLAYERS</h3>
              <div className="space-y-1">
                <div><span className="text-[6.5px] text-cyan-400 font-bold block">PLAYER 1</span><div className="grid grid-cols-2 gap-1">{CAST_DATA.player1.map((actor) => <ActorCard key={actor.name} actor={actor} compact={true} userCount={getActorUserCount(actor.name)} totalScheduleCount={getActorTotalScheduleCount(actor.name)} />)}</div></div>
                <div><span className="text-[6.5px] text-cyan-400 font-bold block">PLAYER 2</span><div className="grid grid-cols-2 gap-1">{CAST_DATA.player2.map((actor) => <ActorCard key={actor.name} actor={actor} compact={true} userCount={getActorUserCount(actor.name)} totalScheduleCount={getActorTotalScheduleCount(actor.name)} />)}</div></div>
                <div><span className="text-[6.5px] text-cyan-400 font-bold block">PLAYER 3</span><div className="grid grid-cols-2 gap-1">{CAST_DATA.player3.map((actor) => <ActorCard key={actor.name} actor={actor} compact={true} userCount={getActorUserCount(actor.name)} totalScheduleCount={getActorTotalScheduleCount(actor.name)} />)}</div></div>
                <div><span className="text-[6.5px] text-cyan-400 font-bold block">PLAYER 4</span><div className="grid grid-cols-2 gap-1">{CAST_DATA.player4.map((actor) => <ActorCard key={actor.name} actor={actor} compact={true} userCount={getActorUserCount(actor.name)} totalScheduleCount={getActorTotalScheduleCount(actor.name)} />)}</div></div>
              </div>
            </div>
            
            <div className="space-y-0.5"><h3 className="text-[7.5px] font-bold text-slate-400 uppercase tracking-wider border-b border-slate-800 pb-0.5">PIANIST</h3><div className="grid grid-cols-3 gap-1">{CAST_DATA.pianist.map((actor) => <ActorCard key={actor.name} actor={actor} compact={true} userCount={getActorUserCount(actor.name)} totalScheduleCount={getActorTotalScheduleCount(actor.name)} />)}</div></div>
          </section>

          {/* 6. 페어별 단체사진 */}
          <section className="bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden">
            <button onClick={() => setIsPhotosOpen(!isPhotosOpen)} className="w-full p-3 flex justify-between items-center bg-slate-900">
              <div className="flex items-center gap-1.5 text-xs font-bold text-cyan-400">
                <Camera className="w-3.5 h-3.5" />
                <span>&lt;페어별 단체사진&gt;</span>
                <span className="text-[8px] text-slate-500 font-normal ml-0.5">({PAIR_PHOTOS.filter(p => p.image).length}/{PAIR_PHOTOS.length})</span>
              </div>
              <div className="flex items-center gap-1 text-[10px] text-slate-400"><span>{isPhotosOpen ? '접기' : '펼치기'}</span>{isPhotosOpen ? <ChevronUp className="w-3.5 h-3.5" /> : <ChevronDown className="w-3.5 h-3.5" />}</div>
            </button>
            {isPhotosOpen && (
              <div className="p-3 border-t border-slate-800 space-y-3 bg-slate-950/50 max-h-[400px] overflow-y-auto no-scrollbar">
                {PAIR_PHOTOS.map((photo) => (
                  <div key={photo.id} className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden p-2 space-y-1.5">
                    <div className="text-[10px] text-slate-300 font-bold border-b border-slate-800 pb-1 flex justify-between items-center">
                      <span>{photo.date}</span>
                      {photo.image ? <span className="text-[8px] text-emerald-400 bg-emerald-950/80 border border-emerald-800 px-1 rounded">업데이트 완료</span> : <span className="text-[8px] text-slate-500">대기 중</span>}
                    </div>
                    {photo.image ? (
                      <a href={photo.url} target="_blank" rel="noreferrer" className="block relative aspect-video bg-slate-950 rounded-lg overflow-hidden border border-slate-800 hover:opacity-90 active:scale-98 transition cursor-pointer">
                        <img src={photo.image} alt={photo.date} className="w-full h-full object-cover" />
                        <div className="absolute bottom-1 right-1 bg-slate-950/80 px-1.5 py-0.5 rounded text-[7px] text-cyan-400 flex items-center gap-0.5 border border-slate-800">
                          <span>공식 게시물</span>
                          <ExternalLink className="w-2 h-2" />
                        </div>
                      </a>
                    ) : (
                      <div className="h-16 bg-slate-950/50 rounded-lg border border-dashed border-slate-800 flex items-center justify-center text-[9px] text-slate-600">
                        사진 업로드 예정
                      </div>
                    )}
                  </div>
                ))}
              </div>
            )}
          </section>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
